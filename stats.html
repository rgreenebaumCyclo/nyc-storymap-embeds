<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NYC Stat Strip</title>
<link rel="stylesheet" href="base.css">
<style>
html,body{overflow:auto}
body{display:flex;align-items:center;min-height:100%;background:linear-gradient(135deg,#06182c,#0b2a4a)}
#grid{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);margin:0}
.cell{background:#071b32;padding:28px 22px;position:relative;overflow:hidden}
.cell::before{content:"";position:absolute;left:0;top:0;height:3px;width:34px;background:var(--a,var(--blue));transition:width .6s}
.cell:hover::before{width:100%}
.n{font-size:clamp(34px,6vw,60px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.l{margin-top:8px;color:var(--mut);font-size:13px;letter-spacing:.04em}
</style></head><body>
<div id="grid"></div>
<script>
// Params: ?items=1.8M+:Images captured in 2026;5:Boroughs   (value:Label;value:Label)
// Optional: &dur=1800 (ms)
const Q=new URLSearchParams(location.search);
const DEF='1.8M+:Street-level images captured in 2026;5:Boroughs';
const items=(Q.get('items')||DEF).split(';').map(s=>{const i=s.indexOf(':');return[s.slice(0,i),s.slice(i+1)]});
const COLS=['#2f8cff','#ff7a2f','#13c4a8','#a78bfa','#f4c430'],dur=+(Q.get('dur')||1800);
const grid=document.getElementById('grid');
items.forEach(([val,label],i)=>{
 const m=val.match(/^([^\d]*)([\d,]*\.?\d+)(.*)$/);const d=document.createElement('div');d.className='cell';d.style.setProperty('--a',COLS[i%5]);
 d.innerHTML=`<div class="n">${m?'':val}</div><div class="l"></div>`;d.querySelector('.l').textContent=label;grid.appendChild(d);
 if(!m)return;const num=parseFloat(m[2].replace(/,/g,'')),dec=(m[2].split('.')[1]||'').length,comma=m[2].includes(',');
 const n=d.querySelector('.n'),t0=performance.now()+i*120;
 (function f(t){const k=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-k,4),x=num*e;
  n.textContent=m[1]+(comma?x.toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec}):x.toFixed(dec))+m[3];if(k<1)requestAnimationFrame(f)})(t0);
});
</script></body></html>
