 g.save();g.beginPath();rr(g,x+w*.1,y+len*.36,w*.8,len*.28,w*.1);g.clip();g.fillStyle='#f4f7fc';g.fillRect(x,y,w,len);g.fillStyle='#d6322c';const sh=len*.075;for(let k=-6;k<10;k++){g.beginPath();g.moveTo(x,y+len*.36+k*sh*2);g.lineTo(cx,y+len*.36+k*sh*2-sh*1.2);g.lineTo(x+w,y+len*.36+k*sh*2);g.lineTo(x+w,y+len*.36+k*sh*2+sh);g.lineTo(cx,y+len*.36+k*sh*2-sh*.2);g.lineTo(x,y+len*.36+k*sh*2+sh);g.fill()}g.restore();
 g.fillStyle='#8fc3ff';g.beginPath();g.arc(cx,cy+len*.08,w*.14,0,7);g.fill();g.restore()}

 const s=H/1050,cxw=P0[0]+DV[0]*(-TRAVEL/2+TRAVEL*t),cyw=P0[1]+DV[1]*(-TRAVEL/2+TRAVEL*t),VX=W*.5,VY=H*.64;
 if(ready){const cs=meta.cell*1.04,dp=Math.max(1.6,H/420)/s;g.save();
  const A=s*RV[0],C=s*RV[1],B=-s*DV[0],D=-s*DV[1];g.setTransform(DPR*A,DPR*B,DPR*C,DPR*D,DPR*(VX-(A*cxw+C*cyw)),DPR*(VY-(B*cxw+D*cyw)));g.globalCompositeOperation='lighter';
  const rad=Math.hypot(W,H)/s*.62+TL,kx0=Math.floor((cxw-rad)/TL),kx1=Math.floor((cxw+rad)/TL),ky0=Math.floor((cyw-rad)/TL),ky1=Math.floor((cyw+rad)/TL);
  for(let kx=kx0;kx<=kx1;kx++)for(let ky=ky0;ky<=ky1;ky++){const lst=BK.get(kx*100000+ky);if(!lst)continue;for(let q0=0;q0<lst.length;q0++){const i=lst[q0];const vx=WX[i]-cxw,vy=WY[i]-cyw,a=vx*DV[0]+vy*DV[1],b=vx*RV[0]+vy*RV[1],sx=VX+b*s,sy=VY-a*s;if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;
   let al,cr,cg,cb;if(a<=18){const k=Math.exp(a/340);al=.22+.34*k;cr=60+110*k;cg=170+70*k;cb=255}else{const k=Math.exp(-(a-18)/420);al=.07+.1*k;cr=40;cg=110;cb=235}
   g.fillStyle='rgba('+(cr|0)+','+(cg|0)+','+(cb|0)+','+(al*1.25)+')';g.beginPath();g.arc(WX[i],WY[i],cs*.22,0,6.3);g.fill();
   if(a<=18){g.fillStyle='rgba(190,245,255,'+(.35+.5*Math.exp(a/200))+')';for(let q=0;q<3;q++){g.fillRect(WX[i]+(hsh(i,q)-.5)*cs,WY[i]+(hsh(q,i+77)-.5)*cs,dp,dp)}}}}
  g.restore()}
 // light columns + lidar pulses from the vehicle
 g.fillStyle='rgba(120,190,255,.10)';for(const f of[.28,.405,.52]){g.fillRect(W*f,0,2,H)}
 for(let k=0;k<3;k++){const ph=((time*.00045+k/3)%1),r=ph*H*.55;g.strokeStyle=`rgba(80,230,255,${.5*(1-ph)})`;g.lineWidth=2;g.beginPath();g.arc(VX,VY,r,0,7);g.stroke()}
 car(g,VX,VY,H*.12,t);

/* ---------- scene 2: INSIGHT (hotspots on a real street-level capture) ---------- */
const ASSETS=[{n:'Traffic Light',f:'Traffic Control',x:.455,y:.245,c:18},{n:'Streetlight',f:'Traffic Control',x:.155,y:.26,c:16},{n:'Crosswalk',f:'Pedestrian Safety',x:.31,y:.9,c:19},{n:'Traffic Signs',f:'Road Safety',x:.755,y:.69,c:15}];
const tk=$('ticks');for(let i=0;i<20;i++)tk.appendChild(document.createElement('i'));let curA=-1;
function setAsset(i){if(i===curA)return;curA=i;const a=ASSETS[i];$('cT').innerHTML=a.n.toUpperCase()+' <span>· DETECTED</span>';$('cF').textContent=a.f.toUpperCase();[...tk.children].forEach((e,k)=>e.classList.toggle('off',k>=a.c));$('ret').style.left=(a.x*100)+'%';$('ret').style.top=(a.y*100)+'%';placeCard()}
function placeCard(){const a=ASSETS[Math.max(0,curA)],iw=$('imgwrap');if(!iw._g)fit2();const sx=iw._g.l+a.x*iw._g.w,cw=$('card').offsetWidth||400;$('card').style.left=(sx<W*.5?Math.max(14,W-cw-Math.max(14,W*.06)):Math.max(14,W*.06))+'px'}

function scene2(t){const iw=$('imgwrap');if(!iw._g)fit2();iw.style.transform=`scale(${1.02+t*.07})`;{const g=iw._g,top=(H-g.h)/2,vis=ASSETS.map((a,i)=>i).filter(i=>{const a=ASSETS[i],x=g.l+a.x*g.w,y=top+a.y*g.h;return x>W*.08&&x<W*.92&&y>H*.12&&y<H*.9});const L=vis.length?vis:[0];setAsset(L[Math.min(L.length-1,Math.floor(t*L.length*.999))])}$('card').style.opacity=sm(0,.1,t)}
/* ---------- scene 3: INTELLIGENCE (procedural Midtown intersection, top-down) ---------- */
const AV=420,ST=250,AVW=112,STW=72;let seedv=7;const rnd=()=>{seedv|=0;seedv=seedv+0x6D2B79F5|0;let t=Math.imul(seedv^seedv>>>15,1|seedv);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

  const bx0=i*AV+AVW/2+16,bx1=(i+1)*AV-AVW/2-16,by0=j*ST+STW/2+14,by1=(j+1)*ST-STW/2-14;g.fillStyle='#103f92';g.fillRect(tx(bx0-10),ty(by0-10),(bx1-bx0+20)*s,(by1-by0+20)*s);

   g.fillStyle='rgba(120,180,255,.12)';g.fillRect(tx(x+6),ty(by0+6),(bw-18)*s,(by1-by0-12)*s)}}
